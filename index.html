<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML Notes Book</title>
  <meta name="description" content="A dynamic book-style reader for Machine Learning and Graph ML Markdown notes.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf7;
      --surface: #ffffff;
      --surface-soft: #f4f0e8;
      --ink: #22201c;
      --muted: #6f6a61;
      --line: #ded7c9;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --accent-soft: #d9f1ed;
      --mark: #8b2d3c;
      --chrome: rgba(255, 255, 255, 0.82);
      --chrome-strong: rgba(251, 250, 247, 0.92);
      --stat-bg: rgba(255, 255, 255, 0.72);
      --hover: rgba(15, 118, 110, 0.08);
      --quote-bg: rgba(15, 118, 110, 0.06);
      --diagram-bg: #fffdfa;
      --code-bg: #211f1b;
      --code-fg: #f7f0e2;
      --active-shadow: 0 1px 5px rgba(47, 42, 34, 0.12);
      --shadow: 0 18px 50px rgba(47, 42, 34, 0.12);
      --sidebar: 330px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.dark {
      color-scheme: dark;
      --paper: #111315;
      --surface: #1a1d20;
      --surface-soft: #252a2e;
      --ink: #eee8dc;
      --muted: #b6aca0;
      --line: #3a3f44;
      --accent: #4db6ac;
      --accent-strong: #7bd6ce;
      --accent-soft: #153b38;
      --mark: #f0a5b5;
      --chrome: rgba(20, 23, 26, 0.96);
      --chrome-strong: rgba(26, 29, 32, 0.96);
      --stat-bg: #22272b;
      --hover: rgba(77, 182, 172, 0.12);
      --quote-bg: rgba(77, 182, 172, 0.11);
      --diagram-bg: #f7f3ea;
      --code-bg: #0d0f11;
      --code-fg: #f3ecdc;
      --active-shadow: none;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--chrome);
      backdrop-filter: blur(18px);
      z-index: 20;
    }

    .brand {
      padding: 22px 22px 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .book-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      color: white;
      background: var(--accent);
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      position: relative;
    }

    .search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 17px;
      height: 17px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px 9px 38px;
      color: var(--ink);
      background: var(--surface);
      outline: none;
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .segmented button {
      min-height: 32px;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
    }

    .segmented button.active {
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--active-shadow);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .stat {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--stat-bg);
    }

    .stat strong {
      display: block;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.1;
    }

    .chapters {
      padding: 14px 10px 26px;
    }

    .section {
      margin: 8px 0 18px;
    }

    .section-toggle {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 34px;
      border-radius: 8px;
      padding: 0 10px 0 12px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
    }

    .section-toggle:hover {
      background: var(--hover);
    }

    .section-toggle svg {
      width: 15px;
      height: 15px;
      transition: transform 160ms ease;
    }

    .section.collapsed .section-toggle svg {
      transform: rotate(-90deg);
    }

    .section-count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      text-transform: none;
    }

    .section-body {
      padding-top: 6px;
    }

    .section.collapsed .section-body {
      display: none;
    }

    .chapter-button {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 48px;
      margin: 2px 0;
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--ink);
      background: transparent;
      text-align: left;
    }

    .chapter-button:hover {
      background: var(--hover);
    }

    .chapter-button.active {
      color: var(--accent-strong);
      background: var(--accent-soft);
    }

    .chapter-number {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      text-align: right;
    }

    .chapter-title {
      overflow: hidden;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter-meta {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .main {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 62px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: var(--chrome-strong);
      backdrop-filter: blur(18px);
      z-index: 10;
    }

    .mobile-menu {
      display: none;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .crumb {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--ink);
      background: var(--surface);
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }

    .theme-toggle {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
    }

    .theme-toggle:hover,
    .source-link:hover {
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .reader-shell {
      width: min(100%, 1280px);
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    .book {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 18px;
      align-items: start;
    }

    .page {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .page-header {
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--mark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .page-path {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
    }

    .content {
      padding: 18px 24px 28px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.72;
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4 {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .content h1 {
      margin: 28px 0 18px;
      font-size: 34px;
    }

    .content h2 {
      margin: 34px 0 14px;
      font-size: 26px;
    }

    .content h3 {
      margin: 28px 0 12px;
      font-size: 21px;
    }

    .content p,
    .content ul,
    .content ol,
    .content table,
    .content pre,
    .content blockquote {
      margin-top: 0;
      margin-bottom: 18px;
    }

    .content a {
      color: var(--accent-strong);
    }

    .content code {
      border-radius: 5px;
      padding: 0.15em 0.32em;
      background: var(--surface-soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.88em;
    }

    .content pre {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: var(--code-bg);
      color: var(--code-fg);
    }

    .content pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .content table {
      display: block;
      width: 100%;
      overflow: auto;
      border-collapse: collapse;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    .content th,
    .content td {
      border: 1px solid var(--line);
      padding: 9px 11px;
      text-align: left;
      vertical-align: top;
    }

    .content th {
      background: var(--surface-soft);
    }

    .content blockquote {
      margin-left: 0;
      border-left: 4px solid var(--accent);
      padding: 8px 0 8px 16px;
      color: var(--muted);
      background: var(--quote-bg);
    }

    .mermaid-diagram {
      overflow: auto;
      margin: 0 0 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: var(--diagram-bg);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      text-align: center;
    }

    .mermaid-diagram svg {
      max-width: 100%;
      height: auto;
    }

    .mermaid-error {
      color: #9f1239;
      text-align: left;
      white-space: pre-wrap;
    }

    .toc {
      position: sticky;
      top: 82px;
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 104px);
      overflow: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .toc h2 {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toc a {
      display: block;
      border-left: 2px solid var(--line);
      padding: 5px 0 5px 10px;
      color: var(--muted);
      text-decoration: none;
      line-height: 1.3;
    }

    .toc a:hover {
      border-left-color: var(--accent);
      color: var(--accent-strong);
    }

    .pager {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .pager button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 13px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
    }

    .pager button:last-child {
      justify-content: flex-end;
      text-align: right;
    }

    .pager button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .pager span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty,
    .loading,
    .error {
      padding: 34px;
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
    }

    .error {
      color: #9f1239;
    }

    body.sidebar-open {
      overflow: hidden;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(88vw, 360px);
        transform: translateX(-102%);
        transition: transform 180ms ease;
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      .mobile-menu {
        display: grid;
      }

      .book {
        grid-template-columns: 1fr;
      }

      .toc {
        position: static;
        max-height: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: var(--chrome);
      }
    }

    @media (max-width: 620px) {
      .topbar {
        padding: 0 14px;
      }

      .reader-shell {
        padding: 12px 8px 28px;
      }

      .page-header,
      .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .content {
        font-size: 16px;
      }

      .pager {
        grid-template-columns: 1fr;
      }

      .source-link span {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-row">
          <div class="book-mark"><i data-lucide="book-open"></i></div>
          <h1>ML Notes Book</h1>
        </div>
        <p>Markdown chapters from this repository, rendered as a browsable book.</p>
      </div>
      <div class="controls">
        <label class="search">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="Search chapters" autocomplete="off">
        </label>
        <div class="segmented" aria-label="Note variant">
          <button type="button" data-variant="base">Base</button>
          <button type="button" class="active" data-variant="expanded">Expanded</button>
          <button type="button" data-variant="all">All</button>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" type="button" id="menuButton" aria-label="Open chapters">
          <i data-lucide="menu"></i>
        </button>
        <div class="crumb" id="crumb">Loading notes...</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="theme-toggle" type="button" id="themeToggle" aria-label="Toggle dark mode">
            <i data-lucide="moon"></i>
          </button>
          <a class="source-link" href="https://subhajithait.com" target="_blank" rel="noreferrer">
            <i data-lucide="user"></i>
            <span>Author</span>
          </a>
          <a class="source-link" id="sourceLink" href="https://github.com/subho004/ml-graph-learning-notebook" target="_blank" rel="noreferrer">
            <i data-lucide="external-link"></i>
            <span>Open source</span>
          </a>
        </div>
      </header>

      <div class="reader-shell">
        <div class="book">
          <article class="page">
            <header class="page-header">
              <p class="eyebrow" id="eyebrow">Machine Learning</p>
              <h2 class="page-title" id="pageTitle">Loading...</h2>
              <p class="page-path" id="pagePath"></p>
            </header>
            <div class="content" id="content">
              <div class="loading">Finding Markdown files...</div>
            </div>
          </article>

          <aside class="toc" id="toc" aria-label="On this page"></aside>
        </div>

        <div class="pager">
          <button id="prevButton" type="button" disabled>
            <i data-lucide="chevron-left"></i>
            <span>Previous</span>
          </button>
          <button id="nextButton" type="button" disabled>
            <span>Next</span>
            <i data-lucide="chevron-right"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const FALLBACK_FILES = [
      "ML Notes.md",
      "graph-ml/001-graph-neural-networks/001-graph-neural-networks-expanded.md",
      "graph-ml/001-graph-neural-networks/001-graph-neural-networks.md",
      "graph-ml/002-node-edge-graph-level-features-predictions/002-node-edge-graph-level-features-predictions-expanded.md",
      "graph-ml/002-node-edge-graph-level-features-predictions/002-node-edge-graph-level-features-predictions.md",
      "graph-ml/003-node-embeddings/003-node-embeddings-expanded.md",
      "graph-ml/003-node-embeddings/003-node-embeddings.md",
      "graph-ml/004-pagerank-random-walk-graph-embeddings/004-pagerank-random-walk-graph-embeddings-expanded.md",
      "graph-ml/004-pagerank-random-walk-graph-embeddings/004-pagerank-random-walk-graph-embeddings.md",
      "graph-ml/005-message-passing-gnn/005-message-passing-gnn-expanded.md",
      "graph-ml/005-message-passing-gnn/005-message-passing-gnn.md",
      "graph-ml/006-introduction-to-graph-neural-networks/006-introduction-to-graph-neural-networks-expanded.md",
      "graph-ml/006-introduction-to-graph-neural-networks/006-introduction-to-graph-neural-networks.md",
      "graph-ml/007-general-perspective-gnn/007-general-perspective-gnn-expanded.md",
      "graph-ml/007-general-perspective-gnn/007-general-perspective-gnn.md",
      "graph-ml/008-gnn-augmentation-training/008-gnn-augmentation-training-expanded.md",
      "graph-ml/008-gnn-augmentation-training/008-gnn-augmentation-training.md",
      "graph-ml/009-gnn-expressiveness-weisfeiler-lehman-gin/009-gnn-expressiveness-weisfeiler-lehman-gin-expanded.md",
      "graph-ml/009-gnn-expressiveness-weisfeiler-lehman-gin/009-gnn-expressiveness-weisfeiler-lehman-gin.md",
      "graph-ml/010-heterogeneous-graphs/010-heterogeneous-graphs-expanded.md",
      "graph-ml/010-heterogeneous-graphs/010-heterogeneous-graphs.md",
      "graph-ml/011-knowledge-graph-reasoning-embeddings/011-knowledge-graph-reasoning-embeddings-expanded.md",
      "graph-ml/011-knowledge-graph-reasoning-embeddings/011-knowledge-graph-reasoning-embeddings.md",
      "graph-ml/012-neural-subgraph-matching-counting/012-neural-subgraph-matching-counting-expanded.md",
      "graph-ml/012-neural-subgraph-matching-counting/012-neural-subgraph-matching-counting.md",
      "graph-ml/013-community-detection/013-community-detection-expanded.md",
      "graph-ml/013-community-detection/013-community-detection.md",
      "graph-ml/014-graph-generative-models/014-graph-generative-models-expanded.md",
      "graph-ml/014-graph-generative-models/014-graph-generative-models.md",
      "graph-ml/015-deep-graph-generative-models/015-deep-graph-generative-models-expanded.md",
      "graph-ml/015-deep-graph-generative-models/015-deep-graph-generative-models.md",
      "graph-ml/016-gnn-limitations-position-identity-robustness/016-gnn-limitations-position-identity-robustness-expanded.md",
      "graph-ml/016-gnn-limitations-position-identity-robustness/016-gnn-limitations-position-identity-robustness.md",
      "graph-ml/017-scaling-gnns-large-graphs/017-scaling-gnns-large-graphs-expanded.md",
      "graph-ml/017-scaling-gnns-large-graphs/017-scaling-gnns-large-graphs.md",

    marked.setOptions({
      gfm: true,

      headerIds: false
    });

    function isGitHubPages() {
      return location.hostname.endsWith('.github.io');
    }

    function githubContext() {
      if (!isGitHubPages()) return null;
      const owner = location.hostname.replace('.github.io', '');
      const firstSegment = location.pathname.split('/').filter(Boolean)[0];
      const repo = firstSegment || `${owner}.github.io`;
      return { owner, repo };
    }

    async function discoverMarkdownFiles() {
      const context = githubContext();
      if (!context) return FALLBACK_FILES;

      try {
        const repoResponse = await fetch(`https://api.github.com/repos/${context.owner}/${context.repo}`);
        if (!repoResponse.ok) throw new Error('Repository metadata was not available.');
        const repoData = await repoResponse.json();
        const branch = repoData.default_branch || 'main';
        const treeResponse = await fetch(`https://api.github.com/repos/${context.owner}/${context.repo}/git/trees/${branch}?recursive=1`);
        if (!treeResponse.ok) throw new Error('Repository tree was not available.');
        const treeData = await treeResponse.json();
        const files = treeData.tree
          .filter((item) => item.type === 'blob' && item.path.toLowerCase().endsWith('.md'))
          .map((item) => item.path)
          .filter((path) => path === 'ML Notes.md' || path.startsWith('ml/') || path.startsWith('graph-ml/'))
          .sort(sortPaths);
        return files.length ? files : FALLBACK_FILES;
      } catch (error) {
        console.warn('Using embedded Markdown file list:', error);
        return FALLBACK_FILES;
      }
    }

    function sortPaths(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    }

    function titleFromSlug(value) {
      return value
        .replace(/^\d+-/, '')
        .replace(/-expanded$/, '')
        .split('-')
        .filter(Boolean)
        .map((word) => {
          const upper = new Set(['ml', 'gnn', 'svm', 'knn', 'pca', 'cart', 'cnn', 'nlp', 'xgboost']);
          return upper.has(word) ? word.toUpperCase() : word.charAt(0).toUpperCase() + word.slice(1);
        })
        .join(' ');
    }

    function normalizePath(path) {
      return decodeURIComponent(path).replace(/^\/+/, '');
    }

    function recordFromPath(path) {
      const parts = path.split('/');
      const fileName = parts.at(-1);
      const fileSlug = fileName.replace(/\.md$/i, '');
      const isExpanded = /-expanded$/i.test(fileSlug);
      const top = parts[0];
      const section = top === 'ml' ? 'ML' : top === 'graph-ml' ? 'Graph ML' : 'Overview';
      const sectionOrder = top === 'ml' ? 1 : top === 'graph-ml' ? 2 : 0;
      const folder = parts.length > 1 ? parts[1] : fileSlug;
      const numberMatch = folder.match(/^(\d+)/);
      const number = numberMatch ? Number(numberMatch[1]) : 0;
      const title = path === 'ML Notes.md' ? 'Complete ML Notes' : titleFromSlug(folder);
      return {
        path,
        section,
        sectionOrder,
        title,
        number,
        variant: isExpanded ? 'expanded' : 'base',
        isExpanded,
        searchable: `${section} ${title} ${path}`.toLowerCase()
      };
    }

    function buildRecords(files) {
      return files
        .map(normalizePath)
        .filter((path, index, list) => path.toLowerCase().endsWith('.md') && list.indexOf(path) === index)
        .map(recordFromPath)
        .sort((a, b) => a.sectionOrder - b.sectionOrder || a.number - b.number || Number(a.isExpanded) - Number(b.isExpanded) || sortPaths(a.path, b.path));
    }

    function applyFilters() {
      const query = state.query.trim().toLowerCase();
      state.filtered = state.records.filter((record) => {
        const variantMatches = state.variant === 'all' || record.variant === state.variant || record.section === 'Overview';
        const queryMatches = !query || record.searchable.includes(query);
        return variantMatches && queryMatches;
      });
      renderStats();
      renderChapters();
    }

    function renderStats() {
      const ml = state.records.filter((record) => record.section === 'ML' && record.variant === 'base').length;
      const graph = state.records.filter((record) => record.section === 'Graph ML' && record.variant === 'base').length;
      const files = state.records.length;
      dom.stats.innerHTML = `
        <div class="stat"><strong>${ml}</strong>ML</div>
        <div class="stat"><strong>${graph}</strong>Graph ML</div>
        <div class="stat"><strong>${files}</strong>Files</div>
      `;
    }

    function renderChapters() {
      if (!state.filtered.length) {
        dom.chapters.innerHTML = '<div class="empty">No chapters match the current filters.</div>';
        return;
      }

      const grouped = groupBy(state.filtered, 'section');
      dom.chapters.innerHTML = Object.entries(grouped).map(([section, records]) => `
        <section class="section${state.collapsedSections.has(section) ? ' collapsed' : ''}">
          <button type="button" class="section-toggle" data-section-toggle="${escapeAttr(section)}" aria-expanded="${state.collapsedSections.has(section) ? 'false' : 'true'}">
            <span>${escapeHtml(section)}</span>
            <span class="section-count">${records.length}</span>
            <i data-lucide="chevron-down"></i>
          </button>
          <div class="section-body">
            ${records.map((record) => chapterButton(record)).join('')}
          </div>
        </section>
      `).join('');

      dom.chapters.querySelectorAll('[data-section-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const section = button.dataset.sectionToggle;
          if (state.collapsedSections.has(section)) {
            state.collapsedSections.delete(section);
          } else {
            state.collapsedSections.add(section);
          }
          renderChapters();
        });
      });

      dom.chapters.querySelectorAll('[data-path]').forEach((button) => {
        button.addEventListener('click', () => {
          loadChapter(button.dataset.path, true);
          document.body.classList.remove('sidebar-open');
        });
      });
      refreshIcons();
    }

    function chapterButton(record) {
      const active = record.path === state.activePath ? ' active' : '';
      const number = record.number ? String(record.number).padStart(2, '0') : '';
      const meta = record.variant === 'expanded' ? 'Full' : 'Base';
      return `
        <button type="button" class="chapter-button${active}" data-path="${escapeAttr(record.path)}">
          <span class="chapter-number">${number}</span>
          <span class="chapter-title">${escapeHtml(record.title)}</span>
          <span class="chapter-meta">${meta}</span>
        </button>
      `;
    }

    function groupBy(records, key) {
      return records.reduce((groups, record) => {
        groups[record[key]] = groups[record[key]] || [];
        groups[record[key]].push(record);
        return groups;
      }, {});
    }

    function encodedRelativePath(path) {
      return path.split('/').map(encodeURIComponent).join('/');
    }

    function fileUrl(path) {
      return new URL(encodedRelativePath(path), document.baseURI).toString();
    }

    async function loadChapter(path, pushState = false) {
      const record = state.records.find((item) => item.path === path) || state.filtered[0] || state.records[0];
      if (!record) return;

      state.activePath = record.path;
      updateDocumentMeta(record);
      renderChapters();
      renderPager();
      dom.content.innerHTML = '<div class="loading">Loading chapter...</div>';
      dom.toc.innerHTML = '';

      if (pushState) {
        history.replaceState(null, '', `#${encodeURIComponent(record.path)}`);
      }

      try {
        const response = await fetch(fileUrl(record.path), { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        const html = renderMarkdown(markdown);
        dom.content.innerHTML = html;
        prepareRenderedContent();
      } catch (error) {
        dom.content.innerHTML = `
          <div class="error">
            Could not load <strong>${escapeHtml(record.path)}</strong>. Serve this folder with a static server, or open it from GitHub Pages after deploying.
          </div>
        `;
        console.error(error);
      }
    }

    function updateDocumentMeta(record) {
      const variant = record.variant === 'expanded' ? 'Expanded' : 'Base';
      dom.eyebrow.textContent = `${record.section} / ${variant}`;
      dom.pageTitle.textContent = record.title;
      dom.pagePath.textContent = record.path;
      dom.crumb.textContent = `${record.section} / ${record.title}`;
      document.title = `${record.title} - ML Notes Book`;
    }

    function renderMarkdown(markdown) {
      const { text, math } = protectMath(markdown);
      const html = DOMPurify.sanitize(marked.parse(text));
      return restoreMath(html, math);
    }

    function protectMath(markdown) {
      const math = [];
      const codeFencePattern = /(```[\s\S]*?```|~~~[\s\S]*?~~~)/g;
      const parts = markdown.split(codeFencePattern);
      const protectedText = parts.map((part, index) => {
        if (index % 2 === 1) return part;
        return part
          .replace(/\$\$([\s\S]+?)\$\$/g, (_, body) => mathToken(math, body, true))
          .replace(/\\\[([\s\S]+?)\\\]/g, (_, body) => mathToken(math, body, true))
          .replace(/\\\(([\s\S]+?)\\\)/g, (_, body) => mathToken(math, body, false))
          .replace(/(^|[^\\$])\$([^\n$]+?)\$/g, (match, prefix, body) => `${prefix}${mathToken(math, body, false)}`);
      }).join('');
      return { text: protectedText, math };
    }

    function mathToken(math, body, display) {
      const token = `@@MATH${math.length}@@`;
      math.push({ body: body.trim(), display });
      return token;
    }

    function restoreMath(html, math) {
      return math.reduce((output, item, index) => {
        const open = item.display ? '\\[' : '\\(';
        const close = item.display ? '\\]' : '\\)';
        return output.replaceAll(`@@MATH${index}@@`, `${open}${escapeHtml(item.body)}${close}`);
      }, html);
    }

    function prepareRenderedContent() {
      dom.content.querySelectorAll('a[href]').forEach((link) => {
        const href = link.getAttribute('href');
        if (/^https?:\/\//i.test(href)) {
          link.target = '_blank';
          link.rel = 'noreferrer';
        }
      });

      prepareMermaidBlocks();

      const headings = Array.from(dom.content.querySelectorAll('h1, h2, h3')).map((heading, index) => {
        const slug = slugify(heading.textContent || `section-${index + 1}`);
        const id = dom.content.querySelector(`#${CSS.escape(slug)}`) ? `${slug}-${index + 1}` : slug;
        heading.id = id;
        return { id, text: heading.textContent, level: heading.tagName.toLowerCase() };
      });

      renderToc(headings);
      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise([dom.content]).catch(console.error);
      }
      renderMermaidBlocks();
      refreshIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prepareMermaidBlocks() {
      dom.content.querySelectorAll('pre > code.language-mermaid').forEach((code, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'mermaid-diagram mermaid';
        wrapper.id = `mermaid-${Date.now()}-${index}`;
        wrapper.dataset.mermaidSource = code.textContent.trim();
        wrapper.textContent = wrapper.dataset.mermaidSource;
        code.closest('pre').replaceWith(wrapper);
      });
    }

    async function renderMermaidBlocks() {
      const nodes = Array.from(dom.content.querySelectorAll('.mermaid-diagram'));
      if (!nodes.length) return;

      try {
        await waitForMermaid();
        nodes.forEach((node) => {
          if (node.dataset.mermaidSource) {
            node.removeAttribute('data-processed');
            node.textContent = node.dataset.mermaidSource;
          }
        });
        window.mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: 'base',
          themeVariables: {
            background: '#f7f3ea',
            mainBkg: '#d9f1ed',
            primaryColor: '#d9f1ed',
            primaryTextColor: '#22201c',
            primaryBorderColor: '#0f766e',
            secondaryColor: '#f4f0e8',
            tertiaryColor: '#ffffff',
            lineColor: '#6f6a61',
            fontFamily: 'Inter, ui-sans-serif, system-ui, sans-serif'
          }
        });
        await window.mermaid.run({ nodes });
      } catch (error) {
        nodes.forEach((node) => {
          if (!node.querySelector('svg')) {
            node.classList.add('mermaid-error');
            node.textContent = `Mermaid diagram could not be rendered.\n\n${node.textContent}`;
          }
        });
        console.error(error);
      }
    }

    function waitForMermaid() {
      if (window.mermaid) return Promise.resolve();
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const timer = window.setInterval(() => {
          attempts += 1;
          if (window.mermaid) {
            window.clearInterval(timer);
            resolve();
          } else if (attempts > 80) {
            window.clearInterval(timer);
            reject(new Error('Mermaid library did not load.'));
          }
        }, 50);
      });
    }

    function renderToc(headings) {
      if (!headings.length) {
        dom.toc.innerHTML = '<h2>On This Page</h2><span>No headings found.</span>';
        return;
      }
      dom.toc.innerHTML = `
        <h2>On This Page</h2>
        ${headings.slice(0, 20).map((heading) => `
          <a href="#${escapeAttr(heading.id)}" style="margin-left: ${heading.level === 'h3' ? 12 : heading.level === 'h2' ? 6 : 0}px">
            ${escapeHtml(heading.text)}
          </a>
        `).join('')}
      `;
    }

    function renderPager() {
      const index = state.filtered.findIndex((record) => record.path === state.activePath);
      const previous = index > 0 ? state.filtered[index - 1] : null;
      const next = index >= 0 && index < state.filtered.length - 1 ? state.filtered[index + 1] : null;
      setPagerButton(dom.prevButton, previous, 'Previous', 'chevron-left');
      setPagerButton(dom.nextButton, next, 'Next', 'chevron-right');
    }

    function setPagerButton(button, record, fallback, icon) {
      button.disabled = !record;
      button.dataset.path = record ? record.path : '';
      if (icon === 'chevron-left') {
        button.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeHtml(record ? record.title : fallback)}</span>`;
      } else {
        button.innerHTML = `<span>${escapeHtml(record ? record.title : fallback)}</span><i data-lucide="${icon}"></i>`;
      }
    }

    function slugify(text) {
      return text
        .toLowerCase()
        .replace(/<[^>]*>/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '') || 'section';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    let iconRefreshTimer = null;

    function refreshIcons(attempt = 0) {
      if (window.lucide) {
        window.lucide.createIcons();
        return;
      }
      if (attempt < 80) {
        window.clearTimeout(iconRefreshTimer);
        iconRefreshTimer = window.setTimeout(() => refreshIcons(attempt + 1), 50);
      }
    }

    function applyTheme(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('ml-notes-theme', theme);
      if (dom.themeToggle) {
        dom.themeToggle.innerHTML = `<i data-lucide="${theme === 'dark' ? 'sun' : 'moon'}"></i>`;
        dom.themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      refreshIcons();
    }

    function bindEvents() {
      dom.searchInput.addEventListener('input', (event) => {
        state.query = event.target.value;
        applyFilters();
        renderPager();
      });

      document.querySelectorAll('[data-variant]').forEach((button) => {
        button.addEventListener('click', () => {
          state.variant = button.dataset.variant;
          document.querySelectorAll('[data-variant]').forEach((item) => item.classList.toggle('active', item === button));
          applyFilters();
          const activeStillVisible = state.filtered.some((record) => record.path === state.activePath);
          if (!activeStillVisible && state.filtered[0]) {
            loadChapter(state.filtered[0].path, true);
          } else {
            renderPager();
          }
        });
      });

      [dom.prevButton, dom.nextButton].forEach((button) => {
        button.addEventListener('click', () => {
          if (!button.disabled && button.dataset.path) loadChapter(button.dataset.path, true);
        });
      });

      dom.menuButton.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-open');
      });

      dom.themeToggle.addEventListener('click', () => {
        const nextTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
        applyTheme(nextTheme);
        renderMermaidBlocks();
      });

      window.addEventListener('hashchange', () => {
        const path = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (path && path !== state.activePath && state.records.some((record) => record.path === path)) {
          loadChapter(path);
        }
      });

      window.addEventListener('load', () => refreshIcons());
    }

    async function init() {
      bindEvents();
      applyTheme(localStorage.getItem('ml-notes-theme') || 'light');
      refreshIcons();
      const files = await discoverMarkdownFiles();
      state.records = buildRecords(files);
      applyFilters();
      const hashPath = decodeURIComponent(location.hash.replace(/^#/, ''));
      const first = state.records.find((record) => record.path === hashPath)
        || state.records.find((record) => record.section === 'ML' && record.variant === 'expanded')
        || state.records.find((record) => record.section === 'ML' && record.variant === 'base')
        || state.records[0];
      if (first) {
        loadChapter(first.path, !hashPath);
      } else {
        dom.content.innerHTML = '<div class="empty">No Markdown notes were found.</div>';
      }
    }

    init();
  </script>
</body>
</html>
